name: Deploy model to online endpoint (PR comment)

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  deploy-prod:
    if: >-
      github.event.issue.pull_request != null &&
      contains(github.event.comment.body, '/deploy-prod')
    runs-on: ubuntu-latest
    environment: prod

    steps:

      # --------------------------------------------------
      # 1. Checkout PR branch
      # --------------------------------------------------
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head

      # --------------------------------------------------
      # 2. Set up Python
      # --------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # --------------------------------------------------
      # 3. Install Azure SDK dependencies
      # --------------------------------------------------
      - name: Install Azure SDK dependencies
        run: |
          python -m pip install --upgrade pip
          pip install azure-ai-ml azure-identity

      # --------------------------------------------------
      # 4. Sign in to Azure
      # --------------------------------------------------
      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # --------------------------------------------------
      # 5. Install Azure ML CLI
      # --------------------------------------------------
      - name: Install Azure ML CLI
        run: |
          az extension add -n ml -y

      # --------------------------------------------------
      # 6. Detect Azure ML workspace and endpoint
      # --------------------------------------------------
      - name: Detect Azure ML workspace
        id: detect
        run: |
          RG_NAME=$(az group list \
            --query "[?starts_with(name,'rg-ai300-l')].name | [0]" \
            -o tsv)

          if [ -z "$RG_NAME" ]; then
            echo "No resource group starting with rg-ai300-l found." >&2
            exit 1
          fi

          WS_NAME=$(az ml workspace list \
            --resource-group "$RG_NAME" \
            --query "[?starts_with(name,'mlw-ai300-l')].name | [0]" \
            -o tsv)

          if [ -z "$WS_NAME" ]; then
            echo "No workspace starting with mlw-ai300-l found in $RG_NAME." >&2
            exit 1
          fi

          SUBSCRIPTION_ID=$(az account show \
            --query id \
            -o tsv)

          # Create deterministic endpoint name
          SUFFIX="${WS_NAME#mlw-ai300-l}"
          ENDPOINT_NAME="diabetes-endpoint-${SUFFIX:0:8}"

          echo "Using Resource Group: $RG_NAME"
          echo "Using Workspace: $WS_NAME"
          echo "Using Subscription: $SUBSCRIPTION_ID"
          echo "Using Endpoint: $ENDPOINT_NAME"

          echo "resource_group=$RG_NAME" >> "$GITHUB_OUTPUT"
          echo "workspace=$WS_NAME" >> "$GITHUB_OUTPUT"
          echo "subscription_id=$SUBSCRIPTION_ID" >> "$GITHUB_OUTPUT"
          echo "endpoint_name=$ENDPOINT_NAME" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------
      # 7. Deploy model
      # --------------------------------------------------
      - name: Deploy model to managed online endpoint
        id: deploy
        run: |
          python src/deploy_to_online_endpoint.py \
            --subscription-id "${{ steps.detect.outputs.subscription_id }}" \
            --resource-group "${{ steps.detect.outputs.resource_group }}" \
            --workspace "${{ steps.detect.outputs.workspace }}" \
            --endpoint-name "${{ steps.detect.outputs.endpoint_name }}" \
            --deployment-name "blue"

      # --------------------------------------------------
      # 8. Get endpoint information
      # --------------------------------------------------
      - name: Get endpoint information
        id: endpoint
        run: |
          ENDPOINT_NAME="${{ steps.detect.outputs.endpoint_name }}"

          echo "Getting endpoint information for: $ENDPOINT_NAME"

          SCORING_URI=$(az ml online-endpoint show \
            --name "$ENDPOINT_NAME" \
            --query scoring_uri \
            -o tsv)

          if [ -z "$SCORING_URI" ]; then
            echo "Unable to retrieve scoring URI." >&2
            exit 1
          fi

          echo "Scoring URI retrieved successfully."

          echo "scoring_uri=$SCORING_URI" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------
      # 9. Comment deployment result on PR
      # --------------------------------------------------
      - name: Comment deployment result on pull request
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.issue.number;

            const endpointName =
              '${{ steps.detect.outputs.endpoint_name }}';

            const deploymentName = 'blue';

            const scoringUri =
              '${{ steps.endpoint.outputs.scoring_uri }}';

            const body = [
              '🚀 **Deployment workflow completed successfully.**',
              '',
              '**Azure Machine Learning deployment**',
              '',
              `- Endpoint: \`${endpointName}\``,
              `- Deployment: \`${deploymentName}\``,
              `- Scoring URI: \`${scoringUri}\``,
              '',
              'Model input and output data collection is enabled for this deployment.',
              '',
              'The model is now deployed to the managed online endpoint in the prod environment.'
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body,
            });
